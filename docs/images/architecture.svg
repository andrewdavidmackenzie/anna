    <text x="42" y="43" text-anchor="middle" font-size="9" fill="#468">anna-kvs</text>
    <rect x="10" y="54" width="65" height="22" rx="3" fill="#cce5ff" stroke="#68a"/>
    <text x="42" y="69" text-anchor="middle" font-size="9" fill="#468">Disk Vol</text>
