name: Build-test-all

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule: # Build every day at 5PM UTC
    - cron: '0 17 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          os: [ macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest ]
          rust: [ stable ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      if: matrix.os != 'windows-latest'
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: InstallDependencies
      if: matrix.os != 'windows-latest'
      run: make dependencies

    - name: InstallDependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install make cmake protoc --no-progress -y

    - name: clippy
      run: make clippy

    - name: build
      if: matrix.os != 'windows-latest'
      run: make build

    - name: build-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo build --quiet

    - name: test
      if: matrix.os != 'windows-latest'
      run: make test

    - name: test-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo test

    - name: Upload coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: rust_workspace.info,server/cpp/build/server.info,clients/cpp/build/client.info,clients/python/coverage.xml,clients/go/annalib/coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true