name: Build-test-all

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule: # Build every day at 5PM UTC
    - cron: '0 17 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq protobuf-compiler
        cargo install cargo-binstall || true
        cargo binstall -y mdbook lychee

    - name: Build and check docs
      run: make docs

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          os: [ macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest ]
          rust: [ stable ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      if: matrix.os != 'windows-latest'
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: InstallDependencies
      if: matrix.os != 'windows-latest'
      run: make dependencies

    - name: InstallDependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install make cmake protoc --no-progress -y

    - name: Setup multi-node loopback alias
      if: runner.os == 'macOS'
      run: sudo ifconfig lo0 alias 127.0.0.2

    - name: clippy
      run: make clippy

    - name: build
      if: matrix.os != 'windows-latest'
      run: make build

    - name: build-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo build --quiet

    - name: test
      if: matrix.os != 'windows-latest'
      run: make test

    - name: docker-test
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Kill any leftover server processes from make test to avoid port conflicts.
        pkill -9 anna-kvs anna-monitor anna-route 2>/dev/null || true
        sleep 2
        docker info > /dev/null 2>&1 || { echo "Docker not available"; exit 1; }
        docker build -t anna-test .
        cargo test --test docker -- --ignored --nocapture

    - name: test-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo test

    - name: Split and upload Rust coverage
      if: matrix.os == 'macos-latest'
      run: |
        lcov --extract rust_workspace.info '*/clients/rust/*' -o rust_client.info --ignore-errors unused 2>/dev/null || true
        lcov --extract rust_workspace.info '*/server/rust/*' -o rust_server.info --ignore-errors unused 2>/dev/null || true

    - name: Upload Rust client coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: rust_client.info
        flags: rust-client
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload Rust server coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: rust_server.info
        flags: rust-server
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload C++ client coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: clients/cpp/build/client.info
        flags: cpp-client
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload Python client coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: clients/python/coverage.xml
        flags: python-client
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload Go client coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: clients/go/annalib/coverage.out
        flags: go-client
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload server coverage (unit + system tests merged)
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: server/cpp/build/server.info
        flags: server-unit-tests,server-system-tests
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true