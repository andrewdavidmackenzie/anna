name: Build-test-all

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule: # Build every day at 5PM UTC
    - cron: '0 17 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          os: [ macos-latest ]
          #os: [ macos-latest, ubuntu-latest ]
          rust: [ stable ]

    steps:
    - uses: actions/checkout@v2

    - name: InstallDependencies
      run: make dependencies

    - name: ConfigureCoverage
      if: matrix.os == 'macos-latest'
      run: |
        echo RUSTFLAGS="-C instrument-coverage" >> "$GITHUB_ENV"
        echo LLVM_PROFILE_FILE="flow-%p-%m.profraw" >> "$GITHUB_ENV"

    - name: clippy
      run: make clippy

    - name: build
      run: make build

    - name: test
      run: make test

    - uses: codecov/codecov-action@v2
      with:
        files: ./build/coverage.info, ./lcov.info

    - name: docs
      if: matrix.os == 'macos-latest'
      run: make docs

    - name: DeployDocsToGHPages
      uses: JamesIves/github-pages-deploy-action@4.1.4
      if: matrix.os == 'macos-latest' && github.ref == 'refs/heads/master'
      with:
        branch: gh-pages
        folder: target/html