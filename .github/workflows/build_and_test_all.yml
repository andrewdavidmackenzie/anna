name: Build-test-all

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule: # Build every day at 5PM UTC
    - cron: '0 17 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq protobuf-compiler
        cargo install cargo-binstall || true
        cargo binstall -y mdbook lychee

    - name: Build and check docs
      run: make docs

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          os: [ macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest ]
          rust: [ stable ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      if: matrix.os != 'windows-latest'
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: InstallDependencies
      if: matrix.os != 'windows-latest'
      run: make dependencies

    - name: InstallDependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install make cmake protoc --no-progress -y

    - name: Setup multi-node loopback alias
      if: runner.os == 'macOS'
      run: sudo ifconfig lo0 alias 127.0.0.2

    - name: clippy
      run: make clippy

    - name: build
      if: matrix.os != 'windows-latest'
      run: make build

    - name: build-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo build --quiet

    - name: test
      if: matrix.os != 'windows-latest'
      run: make test

    - name: test-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo test

    - name: Upload client coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: rust_workspace.info,clients/cpp/build/client.info,clients/python/coverage.xml,clients/go/annalib/coverage.out
        flags: clients
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload server system test coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: server/cpp/build/server-system.info
        flags: server-system-tests
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload server unit test coverage
      if: matrix.os == 'macos-latest'
      uses: codecov/codecov-action@v6
      with:
        files: server/cpp/build/server-unit.info
        flags: server-unit-tests
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true