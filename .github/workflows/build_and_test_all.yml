name: Build-test-all

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule: # Build every day at 5PM UTC
    - cron: '0 17 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          os: [ macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest ]
          rust: [ stable ]

    steps:
    - uses: actions/checkout@v4

    - name: InstallDependencies
      if: matrix.os != 'windows-latest'
      run: make dependencies

    - name: InstallDependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install make cmake protoc --no-progress -y

    - name: clippy
      run: make clippy

    - name: build
      if: matrix.os != 'windows-latest'
      run: make build

    - name: build-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo build --quiet

    - name: test
      if: matrix.os != 'windows-latest'
      run: make test

    - name: test-rust (Windows)
      if: matrix.os == 'windows-latest'
      run: cargo test

    - uses: codecov/codecov-action@v2
      if: matrix.os == 'macos-latest'
      with:
        files: rust_workspace.info,server/cpp/build/server.info,clients/cpp/build/client.info,clients/python/coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}