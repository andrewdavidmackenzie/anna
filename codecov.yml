ignore:
  - "**/tests/**"
  - "**/build/**"
  - "target/**"
  - "**/test_*.py"
  - "**/test_*.cpp"
  - "**/*_test.go"
  - "**/*.pb.go"
  - "**/*_pb2.py"
  - "**/proto/**"

comment:
  layout: "header, diff, components"

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: auto
  individual_components:
    - component_id: rust-client
      name: Rust Client
      paths:
        - clients/rust/
    - component_id: cpp-client
      name: C++ Client
      paths:
        - clients/cpp/
    - component_id: cpp-server
      name: C++ Server
      paths:
        - server/cpp/
    - component_id: python-client
      name: Python Client
      paths:
        - clients/python/
    - component_id: go-client
      name: Go Client
      paths:
        - clients/go/

flags:
  rust-client:
    paths:
      - clients/rust/
    carryforward: true
  cpp-client:
    paths:
      - clients/cpp/
    carryforward: true
  python-client:
    paths:
      - clients/python/
    carryforward: true
  go-client:
    paths:
      - clients/go/
    carryforward: true
  server-system-tests:
    paths:
      - server/cpp/src/
    carryforward: true
  server-unit-tests:
    paths:
      - server/cpp/src/
    carryforward: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 20%
