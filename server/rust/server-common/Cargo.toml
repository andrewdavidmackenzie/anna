[package]
name = "anna-server-common"
version = "0.1.0"
edition = "2021"
description = "Shared types and infrastructure for Anna KVS Rust servers"

[dependencies]
log = "0.4"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
env_logger = "0.11"
