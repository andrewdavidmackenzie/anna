[package]
name = "anna-kvs"
version = "0.1.0"
edition = "2021"
description = "Anna KVS server (Rust port)"

[[bin]]
name = "anna-kvs-rs"
path = "src/main.rs"

[dependencies]
anna-server-common = { path = "../server-common" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
prost = "0.14"
omq-tokio = "0.20"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
