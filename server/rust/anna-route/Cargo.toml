[package]
name = "anna-route"
version = "0.1.0"
edition = "2021"
description = "Anna routing server (Rust port)"

[[bin]]
name = "anna-route-rs"
path = "src/main.rs"

[dependencies]
anna-server-common = { path = "../server-common" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
prost = "0.14"
omq-tokio = "0.21"
tokio = { version = "1", features = ["full"] }
