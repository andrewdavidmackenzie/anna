[package]
name = "anna"
version = "0.1.0"
authors = ["Andrew Mackenzie <andrew@mackenzie-serres.net>"]
description = "A command line tool for the `anna` key-value store"
license = "Apache 2.0"
documentation = "https://github.com/andrewdavidmackenzie/anna/cli/README.md"
repository = "https://github.com/andrewdavidmackenzie/anna/"
readme = "README.md"
edition = "2018"

[[bin]]
name = "anna"
path = "src/main.rs"

[lib]
name = "annalib"
path = "src/lib/lib.rs"

[features]
default = ["causal", "set"]
causal = []
set = []

[dependencies]
clap = "~4"
log = "0.4.17"
simplog = "~1.6"
thiserror = "2"
sysinfo = "0.39.5"
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
rustyline = "18.0.1"
zeromq = "0.6"
tokio = { version = "1", features = ["full"] }
rand = "0.10.2"
prost = "0.14"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
serial_test = "4"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
prost-build = "0.14"
