[package]
name = "anna"
version = "0.1.0"
authors = ["Andrew Mackenzie <andrew@mackenzie-serres.net>"]
description = "A command line tool for the `anna` key-value store"
license = "Apache 2.0"
documentation = "https://github.com/andrewdavidmackenzie/anna/cli/README.md"
repository = "https://github.com/andrewdavidmackenzie/anna/"
readme = "README.md"
edition = "2018"

[[bin]]
name = "anna"
path = "src/main.rs"

[lib]
name = "annalib"
path = "src/lib/lib.rs"

[features]
default = ["causal", "set"]
causal = []
set = []

[dependencies]
clap = "~3"
log = "0.4.17"
simplog = "~1.5"
error-chain = "0.12.2"
sysinfo = "0.25.1"
nix = "0.24.2"
rustyline = "9.0.0"
zmq = "0.9.2"
serde_derive = "~1.0.140"
serde = "~1.0.140"
serde_yaml = "~0.9"
rand = "0.8.5"
rand_pcg = "0.3.1"
prost = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"

[build-dependencies]
prost-build = "0.11"
